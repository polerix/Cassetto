name: Build & Package Cassetto (Windows & macOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Package
        run: npm run build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cassetto-Windows-x64
          path: dist/*

  build-mac:
    name: Build macOS Release (.dmg & .zip)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS Package
        run: npm run build:mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cassetto-macOS-Universal
          path: dist/*.dmg

  release:
    name: Publish GitHub Release (v1.0.0)
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Cassetto-Windows-x64
          path: release-files/windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Cassetto-macOS-Universal
          path: release-files/mac

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Cassetto v1.0.0 (Windows & macOS)
          body: |
            ## 📼 Cassetto Audio Recorder v1.0.0
            High-Fidelity Uncompressed WAV Recording Suite for Windows & macOS.

            ### Downloads Included:
            - **Windows Desktop & Portable Executable**: `Cassetto.exe` / `Cassetto.zip`
            - **macOS Application Package**: `Cassetto.dmg`

            ### Features:
            - 5 Full Interface Themes (Classic Win95, Luxury Wood, 80s Cyberpunk, Hi-Fi Studio, Clear Skeleton)
            - 16-Bit PCM 44.1kHz Stereo/Mono WAV Export
            - Real-Time Dual Channel LED Peak VU Meter
            - Spinning Cassette Tape Spool Visualizer
          draft: false
          prerelease: false
          files: |
            release-files/windows/Cassetto.zip
            release-files/windows/win-unpacked/Cassetto.exe
            release-files/mac/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
