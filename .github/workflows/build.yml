name: Build & Package Cassetto (Windows & macOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Package
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cassetto-Windows-x64
          path: |
            dist/*.exe
          if-no-files-found: warn

  build-mac:
    name: Build macOS Release (.dmg & .zip)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS Package
        run: |
          set -e
          echo "Building macOS Zip package..."
          npx electron-builder --mac --config.mac.target=zip

          echo "Attempting macOS DMG package..."
          npx electron-builder --mac --config.mac.target=dmg || echo "DMG build skipped or unsupported in headless environment"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List Build Output
        run: ls -la dist/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cassetto-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/**/*.dmg
            dist/**/*.zip
          if-no-files-found: warn

  release:
    name: Publish GitHub Release (v1.0.0)
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: always() && (needs.build-windows.result == 'success' || needs.build-mac.result == 'success') && github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Inspect Downloaded Artifacts
        run: ls -laR release-files

      - name: Publish Release with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Listing downloaded files in release-files:"
          find release-files -type f

          mapfile -t ASSETS < <(find release-files -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" \))
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No binary assets found to release!"
            exit 1
          fi

          echo "Found ${#ASSETS[@]} asset(s) to upload:"
          printf ' - %s\n' "${ASSETS[@]}"

          gh release upload v1.0.0 "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
