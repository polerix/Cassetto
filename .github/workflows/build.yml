name: Build & Package Cassetto (Windows & macOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Package
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cassetto-Windows-x64
          path: |
            dist/*.exe
          if-no-files-found: warn

  build-mac:
    name: Build macOS Release (.dmg & .zip)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS Package
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cassetto-macOS-Universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

  release:
    name: Publish GitHub Release (v1.0.0)
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: always() && (needs.build-windows.result == 'success' || needs.build-mac.result == 'success') && github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Download Windows Artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Cassetto-Windows-x64
          path: release-files/windows

      - name: Download macOS Artifact
        if: needs.build-mac.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Cassetto-macOS-Universal
          path: release-files/mac

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: Cassetto v1.0.0 (Windows & macOS)
          body: |
            ## 📼 Cassetto Audio Recorder v1.0.0
            High-Fidelity Uncompressed WAV Recording Suite for Windows & macOS.

            ### Downloads Included:
            - **Windows Standalone Portable Executable**: `Cassetto.exe`
            - **macOS Disk Image Installer**: `Cassetto.dmg`

            ### Features:
            - 5 Full Interface Themes (Classic Win95, Luxury Wood, 80s Cyberpunk, Hi-Fi Studio, Clear Skeleton)
            - 16-Bit PCM 44.1kHz Stereo/Mono WAV Export
            - Real-Time Dual Channel LED Peak VU Meter
            - Spinning Cassette Tape Spool Visualizer
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            release-files/windows/*.exe
            release-files/mac/*.dmg
            release-files/mac/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
