name: Build & Package Cassetto (Windows & macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Package
        run: npm run build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cassetto-Windows-x64
          path: dist/*

  build-mac:
    name: Build macOS Release (.dmg & .zip)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS Package
        run: npm run build:mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cassetto-macOS-Universal
          path: dist/*.dmg
